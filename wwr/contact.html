<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Koffi's Rafting Club</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="Learn more about Koffi's Rafting Club, our history, and find information about how to contact us and our location">
    <meta name="author" content="Josue Yann Martinien Koffi">
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="Raftng logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>Koffi's Rafting Club</h1>
        <section class="contact-section">


            <div class="company-info">


                <p>
                    Address: 123 River Road<br>
                    Adventure City, CIV
                </p>

                <p>Phone: (555) 123-4567</p>

                <p>Email: koffisrafting@email.com</p>

            </div>

            <div class="contact-content">

                <div class="map">

                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9508.92060878665!2d-4.057879641910414!3d5.350918606391275!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sci!4v1785800339429!5m2!1sfr!2sci"
                      allowfullscreen="" loading="lazy">
                    </iframe>

                </div>

                <div class="contact-form">

                    <h2>Send Us a Message</h2>

                    <form>

                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">

                        <p>Purpose of Message:</p>

                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>

                        <label for="message">Message:</label>

                        <textarea id="message" name="message"></textarea>
                        <input type="checkbox" id="newsletter" name="newsletter">

                        <label for="newsletter">
                            Please subscribe me to the monthly newsletter
                        </label>

                        <button type="submit">
                            Get in Touch!
                        </button>

                    </form>

                </div>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-cards">

                <figure>
                    <img src="images/john-smith.jpg" alt="John Smith">
                    <figcaption>John Smith - Rafting Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/mary-johnson.jpg" alt="Mary Johnson">
                    <figcaption>Mary Johnson - River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/david-brown.jpg" alt="David Brown">
                    <figcaption>David Brown - Safety Instructor</figcaption>
                </figure>

            </div>

        </section>


    </main>
    <footer>
        <p>&copy;2026 Koffi's Rafting Club | Josue Yann Martinien Koffi</p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="images/facebook-svgrepo-com.svg" alt="facebook's logo" class="logo">
            </a>
            <a href="youtube.com">
                <img src="images/youtube-168-svgrepo-com.svg" alt="youtube's logo" class="logo">
            </a>
            <a href="indeed.com">
                <img src="images/indeed-svgrepo-com.svg" alt="indeed's logo" class="logo">
            </a>
        </nav>
    </footer>
</body>

</html>
